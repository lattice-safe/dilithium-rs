name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: cargo test --release --features serde
      # The hand-written unsafe AVX2 (x86_64 runner) and NEON (macOS arm64
      # runner) NTT kernels are only compiled under `simd`, so without this
      # line their SIMD-vs-scalar equivalence tests never execute.
      - run: cargo test --release --features simd
      - run: cargo test --release --all-features

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --no-default-features --target wasm32-unknown-unknown

  no_std:
    name: no_std Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - run: cargo build --no-default-features --target thumbv7em-none-eabihf

  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo bench --no-run

  proofs:
    name: Exhaustive Proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Verifies the arithmetic layer over complete finite domains (all of
      # Z_q for the rounding functions, every coefficient value for the
      # packers). Runs in about a second in release mode.
      - run: cargo run --release --example exhaustive_proofs

  kani:
    name: Formal Verification (Kani)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      # Bounded model checking of the arithmetic contracts and of the
      # unpackers' output ranges on arbitrary attacker-supplied bytes.
      # The Montgomery *congruence* harness is excluded: it rests on
      # Q·QINV ≡ 1 (mod 2^32) and bit-blasting a 32-bit multiplicative
      # inverse does not converge. That property is covered exhaustively by
      # the exhaustive-proofs job instead. See src/verification.rs.
      - run: cargo kani --exclude-harness proof_montgomery_reduce_congruence

  deny:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Run cargo-deny on the runner's current stable toolchain (the pinned
      # container action ships a Cargo too old to parse edition-2024 deps).
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage
        # Region/line coverage is at 100%; the gate keeps it there. Rare
        # branches that cannot be reached with real keys (the ||c*t0||
        # rejection, RNG failure, corrupt-key guards) are covered by
        # dedicated tests — see tests/rejection_paths.rs and the
        # bring-your-own-RNG tests.
        run: >-
          cargo llvm-cov --all-features --lcov --output-path lcov.info
          --fail-under-lines 100 --fail-under-regions 100
          --fail-under-functions 100
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
